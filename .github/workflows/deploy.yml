name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets
        run: |
          sed -i "s|___GEMINI_API_KEY___|${{ secrets.GEMINI_API_KEY }}|g" index.html
          sed -i "s|___SUPABASE_URL___|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|___SUPABASE_KEY___|${{ secrets.SUPABASE_KEY }}|g" index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        
