<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Arena | Study OS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #fdfaf5;
            --card-bg: #ffffff;
            --accent-color: #d4a373;
            --text-main: #4a4a4a;
            --text-light: #8e8e8e;
            --border-radius: 20px;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Bento Grid Layout */
        .arena-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto auto auto;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.2s ease;
        }

        .card:hover { transform: translateY(-5px); }

        /* Grid Spanning */
        .chat-section { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; }
        .task-section { grid-column: span 1; grid-row: span 2; }
        .timer-section { grid-column: span 1; }
        .vault-section { grid-column: span 1; }
        .stats-section { grid-column: span 2; }

        /* UI Elements */
        h2 { font-size: 1.2rem; margin-top: 0; color: var(--accent-color); }
        
        #chat-output {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input, button {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #eee;
            outline: none;
        }

        input { flex-grow: 1; }
        button { 
            background: var(--accent-color); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .panic-btn { background: #e63946; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="arena-container">
        <!-- AI Chat Engine -->
        <div class="card chat-section">
            <h2>Architect AI</h2>
            <div id="chat-output">Welcome, Kruthik. What are we conquering today?</div>
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Ask or dictate notes...">
                <button onclick="handleVoice()">🎤</button>
                <button onclick="sendMessage()">Send</button>
            </div>
            <button class="panic-btn" onclick="panicMode()">🚨 PANIC MODE</button>
        </div>

        <!-- Task Manager -->
        <div class="card task-section">
            <h2>Mission Log</h2>
            <div id="task-list">Loading tasks...</div>
        </div>

        <!-- Pomodoro Timer -->
        <div class="card timer-section">
            <h2>Focus</h2>
            <div class="timer-display" id="timer">25:00</div>
            <button style="width:100%" onclick="toggleTimer()" id="timer-btn">Start Session</button>
        </div>

        <!-- Formula Vault (Coming soon) -->
        <div class="card vault-section">
            <h2>Formula Vault</h2>
            <div id="vault-content" style="font-size: 0.8rem; color: var(--text-light);">
                No starred formulas yet.
            </div>
        </div>

        <!-- Progress Stats -->
        <div class="card stats-section">
            <h2>Exam Countdown: <span id="countdown">--</span></h2>
            <p style="font-size: 0.9rem;">Keep the streak alive. Your brain is upgrading.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
