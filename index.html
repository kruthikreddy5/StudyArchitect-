<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect AI</title>
    <style>
        :root { --blue: #3498db; --bg: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        h1 { font-size: 24px; border-bottom: 2px wavy var(--blue); display: inline-block; margin-bottom: 10px; }
        .card { background: #fdfdfd; border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #222; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
        #output { margin-top: 20px; font-size: 15px; line-height: 1.6; color: #444; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <h1>Study Architect</h1>
    <p style="font-size: 14px; color: #666;">Your 11th Grade JEE/EAMCET Partner.</p>

    <div class="card">
        <input type="password" id="apiKey" placeholder="Paste Gemini API Key here">
        <input type="text" id="userGoal" placeholder="e.g. Plan 2 days for Redox Reactions">
        <button onclick="runAgent()">Build My Plan</button>
    </div>

    <div id="output">Plan will appear here...</div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        window.runAgent = async () => {
            const key = document.getElementById('apiKey').value;
            const goal = document.getElementById('userGoal').value;
            const output = document.getElementById('output');

            if(!key) return alert("Please paste your API key first!");
            
            output.innerHTML = "Architect is thinking...";

            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                const prompt = `You are a high-performance Study Architect for a 17-year-old student in Hyderabad preparing for 11th Grade JEE/EAMCET. 
                Goal: ${goal}
                Context: Focus on high-weightage topics first. Be minimalist.
                Output: Provide a clear, step-by-step table. Style: Hacker-minimalist.`;

                const result = await model.generateContent(prompt);
                const response = await result.response;
                output.innerText = response.text();
            } catch (error) {
                output.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
