<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect | Grade 12</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #fdfaf5; /* Creamish White */
            --text-color: #333;
            --accent: #3498db;
            --dot-color: #e5e0d8;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            /* Minimal Dotted Pattern */
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Courier New', monospace;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin-top: 5vh;
        }

        h1 {
            font-weight: normal;
            font-size: 1.5rem;
            letter-spacing: -1px;
            text-decoration: underline wavy var(--accent);
            margin-bottom: 30px;
        }

        .input-group {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #eee;
            backdrop-filter: blur(5px);
        }

        input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #ddd;
            background: transparent;
            margin-bottom: 20px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { opacity: 0.8; }

        #output {
            margin-top: 30px;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .status { font-size: 0.7rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>architect.v2</h1>
        
        <div class="input-group">
            <input type="password" id="geminiKey" placeholder="Gemini API Key">
            <input type="text" id="userId" placeholder="Your Name/ID (e.g. Kruthik)">
            <input type="text" id="userGoal" placeholder="Topic? (e.g. Integrals)">
            <button onclick="runAgent()">Consult Agent</button>
            <div id="status" class="status">System Ready</div>
        </div>

        <div id="output"></div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // --- REPLACE THESE WITH YOUR SUPABASE DETAILS ---
        const SB_URL = "YOUR_SUPABASE_URL";
        const SB_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = str_supabase.createClient(SB_URL, SB_KEY);

        window.runAgent = async () => {
            const key = document.getElementById('geminiKey').value;
            const uid = document.getElementById('userId').value;
            const goal = document.getElementById('userGoal').value;
            const status = document.getElementById('status');
            const output = document.getElementById('output');

            if (!key || !uid) return alert("Missing Key or ID");

            status.innerText = "Syncing with cloud memory...";

            // 1. Fetch memory from Supabase
            const { data: memories } = await supabase
                .from('memories')
                .select('content, category')
                .eq('user_id', uid);

            const memoryContext = memories?.map(m => `[${m.category}]: ${m.content}`).join("\n") || "No history.";

            status.innerText = "Consulting Gemini...";

            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                const prompt = `
                    User: ${uid} (Grade 12)
                    History: ${memoryContext}
                    Current Task: ${goal}
                    
                    Role: Expert Grade-12 Tutor. Provide a plan or explanation.
                    Important: End your response with exactly three tags: 
                    STRENGTH: (what they know)
                    WEAKNESS: (what to fix)
                    LESSON: (key takeaway)
                `;

                const result = await model.generateContent(prompt);
                const text = result.response.text();
                output.innerText = text;

                // 2. Parse tags and save back to Supabase
                const categories = ["STRENGTH", "WEAKNESS", "LESSON"];
                for (const cat of categories) {
                    const match = text.match(new RegExp(`${cat}: (.*)`));
                    if (match) {
                        await supabase.from('memories').insert([
                            { user_id: uid, category: cat, content: match[1] }
                        ]);
                    }
                }
                status.innerText = "Memory Synced.";

            } catch (err) {
                output.innerText = "Error: " + err.message;
            }
        };
    </script>
</body>
</html>
